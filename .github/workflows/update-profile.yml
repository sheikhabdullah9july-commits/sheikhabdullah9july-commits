name: Refresh public profile snapshot

on:
  schedule:
    - cron: '15 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_profile.py
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-snapshot
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read public GitHub data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py
      - name: Commit refreshed assets if changed
        run: |
          git add assets/github-snapshot.svg data/public-snapshot.json
          if git diff --cached --quiet; then
            echo "Snapshot is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh public GitHub snapshot"
          git push
