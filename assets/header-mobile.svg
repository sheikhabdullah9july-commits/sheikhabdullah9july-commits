<svg xmlns="http://www.w3.org/2000/svg" width="600" height="430" viewBox="0 0 600 430" role="img" aria-labelledby="title desc">
<title id="title">M. Abdullah — AI, computer vision and full-stack web</title>
<desc id="desc">A compact mobile introduction in mint, amber and midnight blue.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#17343f"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#7dc7cf" stroke-opacity=".08"/></pattern></defs>
<rect width="600" height="430" rx="20" fill="url(#bg)"/><rect width="600" height="430" rx="20" fill="url(#grid)"/>
<g font-family="Segoe UI,Arial,sans-serif">
<circle cx="38" cy="47" r="5" fill="#5ee6bd"/><text x="53" y="52" font-size="13" letter-spacing="1.8" fill="#85e6c8">BUILD · EXPERIMENT · SHIP</text>
<text x="31" y="145" font-size="62" font-weight="750" letter-spacing="-2" fill="#f0f7fc">M. Abdullah<tspan fill="#5ee6bd">.</tspan></text>
