<path d="M35 278H563" stroke="#426478"/>
<circle r="4" fill="#5ee6bd"><animateMotion dur="5s" repeatCount="indefinite" path="M35 278H563"/></circle>
<text x="34" y="323" font-size="18" fill="#8faebf">Turning ideas into useful applications.</text>
<text x="34" y="382" font-size="15" font-family="Consolas,monospace" fill="#5ee6bd">idea → build → test → improve <tspan fill="#ffbd7a">▍<animate attributeName="opacity" values="1;0;1" dur="1.6s" repeatCount="indefinite"/></tspan></text>
